<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Furniture Outlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EBEBEB;   /* same grey as the logo file */
  --card:#F7F7F9;
  --ink:#0B0B1C;
  --muted:#6A6A7A;
  --line:#C6C6D0;
  --blue:#0000FF;     /* logo blue */
  --ease:cubic-bezier(.2,.7,.2,1);
  --s:120px; --hs:168px; --lw:240px;
}
html,body{height:100%}
body{
  margin:0;box-sizing:border-box;display:flex;flex-direction:column;
  padding-inline:16px;overflow:hidden;
  background:var(--ground);color:var(--ink);
  font:400 14px/1.4 'Archivo','Noto Sans Thai',system-ui,sans-serif;
}

/* top + bottom bars */
.bar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px;
  font:500 11px/1.4 'Archivo','Noto Sans Thai',system-ui,sans-serif;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.bar nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 20px}
.bar a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
.bar a:hover,.bar a:focus-visible{color:var(--blue);border-color:currentColor;outline:none}
.th{display:block;margin-top:2px;font-size:12px;letter-spacing:0;text-transform:none}
.touch{display:none}
@media (hover:none){.mouse{display:none}.touch{display:inline}}
@media (max-width:600px){.tagline,.site{display:none}.bar{justify-content:center}.bar nav{justify-content:center}}

/* stage */
.stage{position:relative;flex:1;min-height:0}
.ring{
  position:absolute;left:50%;top:50%;translate:-50% -50%;
  border:1px solid var(--line);border-radius:50%;pointer-events:none;
}
.logo{
  position:absolute;left:50%;top:50%;translate:-50% -50%;width:var(--lw);
  z-index:3;pointer-events:none;user-select:none;
  animation:logo-in 1s var(--ease) both;
}
@keyframes logo-in{from{opacity:0;scale:.9}}

.box{
  position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);
  margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  z-index:1;color:var(--blue);text-decoration:none;outline:none;
  will-change:transform;-webkit-tap-highlight-color:transparent;
}
.face{
  position:absolute;left:50%;top:50%;box-sizing:border-box;overflow:hidden;
  translate:calc(-50% + var(--dx,0px)) calc(-50% + var(--dy,0px));
  width:var(--s);height:var(--s);
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  transition:width .35s var(--ease),height .35s var(--ease),translate .3s var(--ease),border-color .2s,box-shadow .3s;
}
.front,.back{transition:opacity .2s}
.front{
  position:absolute;inset:0;padding:6%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s) * .05);
}
.front svg{width:44%;height:auto;flex:none}
.front b{font-weight:500;font-size:max(10px,calc(var(--s) * .09));line-height:1.2;text-align:center;color:var(--ink)}
.front i{font-style:normal;font-size:max(8px,calc(var(--s) * .062));letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media (max-width:600px){.front i{display:none}}

/* detail side: fixed size, centred, so the text never reflows while the card grows */
.back{
  position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:var(--hs);height:var(--hs);box-sizing:border-box;padding:14px;
  display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);opacity:0;
}
.back b{font:600 13px/1.25 'Archivo','Noto Sans Thai',sans-serif}
.back i{font:500 9.5px/1.3 'Archivo',sans-serif;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.back span{display:block;font-size:11.5px;line-height:1.5;color:var(--muted)}
.back em{margin-top:auto;font:600 10.5px/1 'Archivo',sans-serif;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}

.box:is(:hover,:focus-visible,.on){z-index:5}
.box:is(:hover,:focus-visible,.on) .face{
  width:var(--hs);height:var(--hs);border-color:var(--blue);
  box-shadow:0 22px 44px -22px rgba(0,0,120,.45);
}
.box:is(:hover,:focus-visible,.on) .front{opacity:0}
.box:is(:hover,:focus-visible,.on) .back{opacity:1;transition-delay:.12s}
.box:focus-visible .face{outline:2px solid var(--blue);outline-offset:3px}

@media (prefers-reduced-motion:reduce){.logo{animation:none}.face,.front,.back{transition:none}}
</style>

const stage=document.getElementById('stage'), ring=document.getElementById('ring'), N=items.length;
stage.insertAdjacentHTML('afterbegin',items.map(o=>`
 <a class="box" href="${BASE+encodeURI(o.path)}" target="_blank" rel="noopener" aria-label="${o.th} — ${o.en}">
  <span class="face">
   <span class="front">${svg(o.ic)}<b>${o.lab}</b><i>${o.en}</i></span>
   <span class="back"><b>${o.th}</b><i>${o.en}</i>${o.sub.map(s=>`<span>${s}</span>`).join('')}<em>Shop ↗</em></span>
  </span>
 </a>`).join(''));
const boxes=[...stage.querySelectorAll('.box')];

// layout: box size, orbit radius, logo width all follow the stage
let W=0,H=0,R=0,HS=168;
function size(){
  W=stage.clientWidth;H=stage.clientHeight;
  const m=Math.min(W,H),s=Math.max(72,Math.min(148,m*.17));
  R=Math.max(0,m/2-s/2-6);HS=Math.max(168,s*1.25);
  const st=stage.style;
  st.setProperty('--s',s+'px');st.setProperty('--hs',HS+'px');
  st.setProperty('--lw',Math.min(320,Math.max(90,(R-s/2)*1.25))+'px');
  ring.style.width=ring.style.height=2*R+'px';
}
new ResizeObserver(size).observe(stage);size();

// motion: boxes spin at the centre -> circle grows to R while spin slows -> slow orbit
const SLOW=.11,FAST=11;                          // rad/s (SLOW = one lap per ~57s)
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const inOut=p=>p<.5?4*p**3:1-(-2*p+2)**3/2, out=p=>1-(1-p)**3;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=still?9:0,th=0,k=1,last=performance.now();

function frame(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;t+=dt;
  const pr=inOut(clamp((t-.7)/3.2)),sc=.3+.7*out(clamp((t-.7)/2)),op=clamp(t/.5);
  const w=still?0:SLOW+(FAST-SLOW)*(1-clamp(t/4.2))**3;
  const h=stage.querySelector('.box:hover,.box:focus-visible,.box.on');   // pause orbit while a box is held
  k+=((h&&t>4.2?0:1)-k)*Math.min(1,dt*6);
  th+=w*k*dt;
  ring.style.scale=pr;ring.style.opacity=op;
  const hw=HS/2;
  boxes.forEach((b,i)=>{
    const a=th+i*2*Math.PI/N-Math.PI/2,x=R*pr*Math.cos(a),y=R*pr*Math.sin(a),f=b.firstElementChild.style;
    b.style.transform=`translate(${x}px,${y}px) rotate(${th*(1-pr)}rad) scale(${sc})`;
    b.style.opacity=op;
    // keep the enlarged card inside the stage
    f.setProperty('--dx',(b===h?clamp(x,-W/2+hw,W/2-hw)-x:0)+'px');
    f.setProperty('--dy',(b===h?clamp(y,-H/2+hw,H/2-hw)-y:0)+'px');
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// touch: first tap previews, second tap opens
const touch=matchMedia('(hover:none)');
stage.addEventListener('click',e=>{
  const b=e.target.closest('.box');
  if(b&&touch.matches&&!b.classList.contains('on')){e.preventDefault();boxes.forEach(x=>x.classList.toggle('on',x===b));}
  else if(!b)boxes.forEach(x=>x.classList.remove('on'));
});
</script>
